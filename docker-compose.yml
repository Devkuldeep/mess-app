# Local development environment.
#
#   docker compose up -d db            # Postgres on localhost:5433; run the app on your machine (fastest)
#   docker compose --profile app up    # Postgres + Next dev server in a container
#   docker compose --profile tools run --rm migrate   # apply migrations
#
# See CLAUDE.md → "Local development".
name: mess-app

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mess
      POSTGRES_PASSWORD: mess
      POSTGRES_DB: mess
      TZ: Asia/Kolkata
    ports:
      # Host port 5433 (not 5432) so it doesn't clash with other local Postgres
      # instances. Override with MESS_DB_PORT=xxxx docker compose up -d db
      - "${MESS_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mess -d mess"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Next.js dev server with hot reload, source mounted from the host.
  app:
    profiles: ["app"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npx prisma migrate deploy && npm run dev -- --hostname 0.0.0.0"
    environment:
      DATABASE_URL: postgresql://mess:mess@db:5432/mess
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules # keep Linux-built deps out of the host folder
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

  # One-off: apply migrations (and optionally seed) against the db container.
  migrate:
    profiles: ["tools"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci --ignore-scripts && npx prisma generate && npx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://mess:mess@db:5432/mess
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
  next_cache:
